name: reca-automation
services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:2.42.4
    restart: unless-stopped
    ports:
      - "127.0.0.1:5680:5678"
    env_file:
      - .local/n8n.env
    environment:
      N8N_HOST: localhost
      N8N_PORT: "5678"
      N8N_PROTOCOL: http
      N8N_EDITOR_BASE_URL: http://localhost:5680
      N8N_SECURE_COOKIE: "false"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_TEMPLATES_ENABLED: "false"
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      EXECUTIONS_DATA_SAVE_ON_ERROR: none
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: none
      EXECUTIONS_DATA_SAVE_MANUAL_EXECUTIONS: "false"
      GENERIC_TIMEZONE: America/New_York
      TZ: America/New_York
      RECA_AUTOMATION_BASE_URL: http://host.docker.internal:8081
      RECA_AUTOMATION_TEST_BASE_URL: http://host.docker.internal:8082
    volumes:
      - reca_n8n_data:/home/node/.n8n
      - ./automation:/files:ro
volumes:
  reca_n8n_data:
